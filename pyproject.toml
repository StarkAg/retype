[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retype-image"
version = "0.1.0"
description = "Change text in scanned documents and photos using the document's own letters - typewriter, printed fonts and handwriting. No GPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Agarwal" }]
requires-python = ">=3.9"
dependencies = ["opencv-python>=4.8", "numpy>=1.24", "pillow>=10.0"]
keywords = [
    "edit text in image", "replace text in image", "scanned document", "document restoration",
    "typewriter", "handwriting", "font matching", "scene text editing", "image editing",
    "inpainting", "opencv", "photo editing", "text replacement", "old documents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/StarkAg/retype"
Issues = "https://github.com/StarkAg/retype/issues"

[project.scripts]
retype = "retype:main"

[tool.setuptools]
py-modules = ["retype"]
